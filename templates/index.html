<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF合并工具</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        /* 居中显示加载动画 */
        .loader {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 9999;
            border: 16px solid #f3f3f3;
            border-top: 16px solid #3498db;
            border-radius: 50%;
            width: 120px;
            height: 120px;
            animation: spin 2s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 上传区域样式 */
        #pdfDropArea {
            border: 2px dashed #ccc;
            padding: 20px;
            cursor: pointer;
            height: 200px; /* 调整上传区域的高度 */
        }

        /* 上传区域拖拽样式 */
        #pdfDropArea.dragover {
            border-color: #007bff;
        }

        /* 已选文件列表样式 */
        #selectedFiles {
            list-style: none;
            padding-left: 0;
        }

        /* 已选文件项样式 */
        .file-item {
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h2 class="mb-4">PDF合并工具</h2>
        <div id="pdfDropArea" class="mb-3" onclick="document.getElementById('pdfFiles').click();">
            <p class="text-muted">拖拽或点击此处选择PDF文件</p>
            <input type="file" id="pdfFiles" name="files[]" multiple style="display: none;" accept=".pdf">
        </div>
        <ul id="selectedFiles" class="mt-3"></ul>
        <button id="mergeButton" type="button" class="btn btn-success mt-3" disabled>合并PDF文件</button>
        <div id="downloadLink" class="mt-3" style="display: none;">
            <a id="downloadButton" class="btn btn-success" href="#" download>下载合并后的PDF</a>
        </div>
    </div>

    <!-- 加载动画 -->
    <div id="loader" class="loader" style="display: none;"></div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <script>
        var selectedFiles = []; // 存储已选文件

        // 显示加载动画
        function showLoader() {
            $('#loader').show();
        }

        // 隐藏加载动画
        function hideLoader() {
            $('#loader').hide();
        }

        // 更新已选文件列表
        function updateSelectedFilesList() {
            var selectedFilesList = $('#selectedFiles');
            selectedFilesList.empty();
            selectedFiles.forEach(function(file, index) {
                var listItem = $('<li class="file-item">' + file.name + ' (' + formatFileSize(file.size) + ') <button type="button" class="btn btn-sm btn-danger" onclick="removeFile(' + index + ')">删除</button></li>');
                selectedFilesList.append(listItem);
            });
            if (selectedFiles.length > 0) {
                $('#mergeButton').prop('disabled', false); // 有选中文件时启用合并按钮
            } else {
                $('#mergeButton').prop('disabled', true); // 没有选中文件时禁用合并按钮
            }
        }

        // 格式化文件大小
        function formatFileSize(size) {
            if (size === 0) return '0 B';
            var units = ['B', 'KB', 'MB', 'GB', 'TB', 'PB', 'EB', 'ZB', 'YB'];
            var i = Math.floor(Math.log(size) / Math.log(1024));
            return (size / Math.pow(1024, i)).toFixed(2) + ' ' + units[i];
        }

        // 处理文件上传和合并
        function handleUpload() {
            showLoader(); // 显示加载动画
            var totalSize = 0;
            selectedFiles.forEach(function(file) {
                totalSize += file.size;
            });
            // 检查文件总大小是否超过40MB
            if (totalSize > 40 * 1024 * 1024) {
                hideLoader(); // 隐藏加载动画
                alert('所选文件总大小超过40MB，不支持上传。'); // 显示警告信息
                return;
            }
            var formData = new FormData();
            selectedFiles.forEach(function(file) {
                formData.append('files[]', file);
            });
            $.ajax({
                url: '/merge',
                type: 'POST',
                data: formData,
                contentType: false,
                processData: false,
                success: function(response) {
                    hideLoader(); // 隐藏加载动画
                    $('#downloadLink').show();
                    $('#downloadButton').attr('href', response);
                },
                error: function(xhr, status, error) {
                    hideLoader(); // 隐藏加载动画
                    alert('发生错误：' + error); // 显示错误信息
                }
            });
        }

        // 移除已选文件
        function removeFile(index) {
            selectedFiles.splice(index, 1);
            updateSelectedFilesList();
        }

        // 监听文件拖拽
        $('#pdfDropArea').on({
            dragover: function(e) {
                e.preventDefault();
                $(this).addClass('dragover');
            },
            dragleave: function(e) {
                e.preventDefault();
                $(this).removeClass('dragover');
            },
            drop: function(e) {
                e.preventDefault();
                $(this).removeClass('dragover');
                var files = e.originalEvent.dataTransfer.files;
                selectedFiles = selectedFiles.concat(Array.from(files)); // 将新选择的文件追加到已选文件列表中
                updateSelectedFilesList();
            }
        });

        // 监听文件选择
        $('#pdfFiles').on('change', function() {
            var files = this.files;
            selectedFiles = selectedFiles.concat(Array.from(files)); // 将新选择的文件追加到已选文件列表中
            updateSelectedFilesList();
        });

        // 监听合并按钮点击事件
        $('#mergeButton').on('click', function() {
            handleUpload();
        });
    </script>
</body>
</html>
